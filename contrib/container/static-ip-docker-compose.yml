# Docker compose recipe for InvenTree with static IP address
# - Runs PostgreSQL as the database backend
# - Uses built-in django webserver (can be changed to gunicorn for production)
# - Runs the InvenTree background worker process
# - Runs the Vite frontend development server
# - Serves media and static content directly from Django webserver

# IMPORTANT NOTE:
# Before running, update STATIC_IP_ADDRESS in docker.static-ip.env with your actual static IP

services:

    # Database service
    # Use PostgreSQL as the database backend
    inventree-static-ip-db:
        image: postgres:17
        container_name: inventree-static-ip-db
        ports:
            # Expose PostgreSQL database on port 5432 for external access
            - 5432:5432
        environment:
            - PGDATA=/var/lib/postgresql/data/pgdb
            - POSTGRES_USER=pguser
            - POSTGRES_PASSWORD=pgpassword
            - POSTGRES_DB=inventree
        volumes:
          # Map 'data' volume such that postgres database is stored externally
          - ./data-static-ip:/var/lib/postgresql/data:z
        restart: unless-stopped
        networks:
            - inventree-static-ip-network

    # InvenTree web server service
    # Runs the django built-in webserver application
    inventree-static-ip-server:
        container_name: inventree-static-ip-server
        depends_on:
          - inventree-static-ip-db
        build: &build_config
            context: ../..
            dockerfile: contrib/container/Dockerfile
            target: dev
        image: inventree-static-ip-image
        ports:
            # Expose web server on port 8000
            - 8000:8000
        volumes:
            # Mount local source directory to /home/inventree
            - ../../:/home/inventree:z
        env_file:
            - docker.static-ip.env
        restart: unless-stopped
        networks:
            - inventree-static-ip-network

    # Background worker process handles long-running or periodic tasks
    inventree-static-ip-worker:
        container_name: inventree-static-ip-worker
        image: inventree-static-ip-image
        build: *build_config
        command: invoke worker
        depends_on:
            - inventree-static-ip-server
        volumes:
            # Mount local source directory to /home/inventree
            - ../../:/home/inventree:z
        env_file:
            - docker.static-ip.env
        restart: unless-stopped
        networks:
            - inventree-static-ip-network

    # Frontend development server
    # Runs the Vite development server
    inventree-static-ip-frontend:
        container_name: inventree-static-ip-frontend
        image: inventree-static-ip-image
        build: *build_config
        working_dir: /home/inventree
        command: sh -c "cd src/frontend && yarn install && yarn run compile && yarn run dev --host"
        depends_on:
            - inventree-static-ip-server
        ports:
            # Expose frontend dev server on port 5173
            - 5173:5173
        volumes:
            # Mount local source directory to /home/inventree
            - ../../:/home/inventree:z
        env_file:
            - docker.static-ip.env
        restart: unless-stopped
        networks:
            - inventree-static-ip-network

networks:
    inventree-static-ip-network:
        driver: bridge

